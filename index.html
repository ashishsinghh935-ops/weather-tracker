<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Air Quality Tracker</title>
    <!-- This links to the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather & AQI Tracker</h1>
            
            <!-- NEW: Dropdowns instead of text input -->
            <div class="search-box">
                <select id="state-select">
                    <option value="">Select a State...</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                </select>
                <select id="city-select" disabled>
                    <option value="">Select a City...</option>
                </select>
                <button id="search-btn">Search</button>
            </div>
        </header>

        <!-- This section will stay hidden until the user searches -->
        <main id="weather-display" class="hidden">
            
            <section class="current-weather">
                <h2 id="city-name">City Name</h2>
                <p id="temperature">--°C</p>
                <p id="condition">Weather Condition</p>
            </section>

            <section class="details">
                <div class="card">
                    <h3>Air Quality Index</h3>
                    <p id="aqi">--</p>
                </div>
                <div class="card">
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>
                <div class="card">
                    <h3>Wind Speed</h3>
                    <p id="wind-speed">-- km/h</p>
                </div>
            </section>

            <!-- NEW: 5-Day Forecast Section -->
            <section class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecast-container" class="forecast-container">
                    <!-- JavaScript will inject forecast cards here -->
                </div>
            </section>
            
        </main>
    </div>

    <!-- This links to the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
